<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171827"><title>Little Raven — Virtual Pet</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7edf9;background:#171827}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#35334d,#171827 72%)}main{text-align:center;width:min(100%,600px);padding:24px}h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 6px}p{color:#d3cce0;margin:0 0 28px}.stage{height:min(55svh,440px);min-height:300px;position:relative;display:grid;place-items:center;isolation:isolate}.glow{position:absolute;bottom:35px;width:250px;height:44px;background:#080a16;border-radius:50%;filter:blur(13px);opacity:.65}.raven{position:relative;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;outline-offset:12px;-webkit-tap-highlight-color:transparent;animation:bob 3.1s ease-in-out infinite}.raven:focus-visible{outline:3px solid #ffadd6;border-radius:30px}.raven svg{display:block;width:clamp(210px,60vw,300px);height:auto;filter:drop-shadow(0 15px 12px #090b19a0)}.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}.wing{transform-box:fill-box;transform-origin:25% 30%;animation:wing 3.1s ease-in-out infinite}.raven.happy{animation:hop .5s ease-in-out}.raven.happy .wing{animation:flap .23s ease-in-out 3}.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;font-size:clamp(22px,6vw,34px);animation:floatUp 1.3s ease-out forwards;filter:drop-shadow(0 2px 3px #0004)}.hint{font-size:.95rem;margin-top:8px;color:#f3b9d9}.status{min-height:1.5em;color:#ffb5d8}@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}@keyframes blink{0%,42%,45%,100%{transform:scaleY(1)}43.5%{transform:scaleY(.1)}}@keyframes wing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-30px)}}@keyframes flap{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-28deg)}}@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(-15deg)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--drift)), -155px) scale(1.35) rotate(18deg)}}@media(prefers-reduced-motion:reduce){.raven,.wing,.eye{animation:none}.raven.happy{animation:none}.heart{animation-duration:.2s}}
</style>
</head>
<body><main><h1>Little Raven</h1><p>A tiny friend who loves attention.</p><section class="stage" aria-label="Your raven's perch"><div class="glow" aria-hidden="true"></div><button class="raven" id="pet" aria-label="Pet the raven" title="Pet the raven">
<svg viewBox="0 0 300 330" role="img" aria-label="A cute round raven with purple feathers and bright eyes" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="151" cy="299" rx="75" ry="13" fill="#49415e"/><path d="M103 244 90 301l34-14 23 13 15-48" fill="#24243c"/><path d="M174 252 192 301l-33-12-18 12-10-50" fill="#29273f"/>
<path d="M96 196 Q58 177 64 135 Q90 152 103 154" fill="#38354f"/>
<path d="M197 195 Q246 171 233 133 Q216 152 192 156" fill="#36314c"/>
<ellipse cx="150" cy="180" rx="94" ry="104" fill="#29273d"/><ellipse cx="150" cy="196" rx="73" ry="78" fill="#34314c"/>
<path class="wing" d="M87 166 Q40 192 70 242 Q89 260 111 232 Q89 214 87 166" fill="#201f35"/><path d="M83 216q12 18 29 16" stroke="#514965" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M108 90 100 61 128 77 147 44 161 77 191 59 189 101" fill="#29273d"/>
<ellipse cx="112" cy="150" rx="23" ry="27" fill="#f9f5ff"/><ellipse cx="187" cy="150" rx="23" ry="27" fill="#f9f5ff"/><g class="eye"><ellipse cx="118" cy="154" rx="12" ry="17" fill="#171827"/><ellipse cx="193" cy="154" rx="12" ry="17" fill="#171827"/><circle cx="122" cy="148" r="4.5" fill="white"/><circle cx="197" cy="148" r="4.5" fill="white"/></g>
<path d="M131 173 Q150 166 170 173 L151 197Z" fill="#e5ad65"/><path d="M131 173 Q150 185 170 173" fill="none" stroke="#bd824f" stroke-width="2"/><ellipse cx="94" cy="186" rx="15" ry="8" fill="#bd6d97" opacity=".3"/><ellipse cx="207" cy="186" rx="15" ry="8" fill="#bd6d97" opacity=".3"/>
<path d="M195 219 Q234 207 238 179 Q256 220 209 251" fill="#242239"/><path d="M205 245q18-5 27-17" stroke="#514965" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg></button><div class="hearts" id="hearts" aria-hidden="true"></div></section><div class="hint">Tap or click the raven to pet it ♡</div><div class="status" id="status" aria-live="polite"></div></main>
<script>
const pet=document.getElementById('pet'),hearts=document.getElementById('hearts'),status=document.getElementById('status');let timer;
pet.addEventListener('click',()=>{pet.classList.remove('happy');void pet.offsetWidth;pet.classList.add('happy');clearTimeout(timer);timer=setTimeout(()=>pet.classList.remove('happy'),600);status.textContent='Your raven feels loved!';const a=pet.getBoundingClientRect(),b=hearts.getBoundingClientRect();for(let i=0;i<5;i++){const h=document.createElement('span');h.className='heart';h.textContent=i%2?'♥':'♡';h.style.color=i%2?'#ff91bd':'#ffd0e5';h.style.left=(a.left-b.left+a.width*(.25+Math.random()*.5))+'px';h.style.top=(a.top-b.top+a.height*(.2+Math.random()*.35))+'px';h.style.setProperty('--drift',(Math.random()*110-55)+'px');h.style.animationDelay=(i*.07)+'s';hearts.append(h);setTimeout(()=>h.remove(),1600)}});
</script></body></html>
