<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171827"><title>Little Raven — Virtual Pet</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7edf9;background:#171827}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#35334d,#171827 72%)}main{text-align:center;width:min(100%,600px);padding:24px}h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 6px}.version{font-size:clamp(1rem,4.5vw,1.35rem);font-weight:800;color:#ffffff;vertical-align:middle;white-space:nowrap}p{color:#d3cce0;margin:0 0 28px}.stage{height:min(55svh,440px);min-height:300px;position:relative;display:grid;place-items:center;isolation:isolate}.glow{position:absolute;bottom:35px;width:250px;height:44px;background:#080a16;border-radius:50%;filter:blur(13px);opacity:.65}.perch{position:absolute;width:clamp(210px,60vw,300px);height:auto;pointer-events:none}.raven{position:relative;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;outline-offset:12px;-webkit-tap-highlight-color:transparent;animation:none}.raven:focus-visible{outline:3px solid #ffadd6;border-radius:30px}.raven svg{display:block;width:clamp(210px,60vw,300px);height:auto;filter:drop-shadow(0 15px 12px #090b19a0)}.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}.wing{transform-box:fill-box;transform-origin:25% 30%;animation:wing 3.1s ease-in-out infinite}.raven.happy{animation:hop .5s ease-in-out}.raven.happy .wing{animation:flap .23s ease-in-out 3}.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;font-size:clamp(22px,6vw,34px);animation:floatUp 1.3s ease-out forwards;filter:drop-shadow(0 2px 3px #0004)}.hint{font-size:.95rem;margin-top:8px;color:#f3b9d9}.status{min-height:1.5em;color:#ffb5d8}@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}@keyframes blink{0%,42%,45%,100%{transform:scaleY(1)}43.5%{transform:scaleY(.1)}}@keyframes wing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-30px)}}@keyframes flap{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-28deg)}}@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(-15deg)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--drift)), -155px) scale(1.35) rotate(18deg)}}@media(prefers-reduced-motion:reduce){.wing,.eye{animation:none}.raven.happy{animation:hop .5s ease-in-out}.raven.happy .wing{animation:flap .23s ease-in-out 3}.heart{animation-duration:1.3s}}
.needs{display:grid;gap:9px;margin:12px auto;max-width:340px;text-align:left}.need{display:grid;grid-template-columns:80px 1fr 36px;align-items:center;gap:10px;font-size:.85rem}.meter{height:11px;background:#111321;border-radius:12px;overflow:hidden}.fill{height:100%;background:#e9a1cc;width:70%;transition:width .3s}.actions{display:flex;justify-content:center;gap:12px;margin:16px}.actions button{background:#49405f;color:white;border:1px solid #86749d;border-radius:16px;padding:12px 22px;font:inherit;cursor:pointer;touch-action:manipulation}.actions button:active{transform:scale(.96)}.raven.sleeping .eye,.raven.sleeping .wing{animation:none}.raven.sleeping .eye{opacity:0}.raven.sleeping svg>ellipse:nth-of-type(3),.raven.sleeping svg>ellipse:nth-of-type(4){opacity:0}.sleep-eyes{opacity:0}.raven.sleeping .sleep-eyes{opacity:1}.raven.sleeping{transform:translateY(5px);animation:sleepBreath 4.5s ease-in-out infinite;transform-origin:50% 78%}@keyframes sleepBreath{0%,100%{transform:translateY(5px) scale(1)}38%{transform:translateY(1px) scale(1.055,1.075)}57%{transform:translateY(3px) scale(1.04,1.045)}70%{transform:translateY(6px) scale(.985,.98)}74%{transform:translateY(5px) scale(1.008,.995)}78%{transform:translateY(5px) scale(.995,1)} }.zzz{position:absolute;top:28%;right:29%;width:75px;height:70px;color:#dfc2ff;opacity:0;pointer-events:none}.zzz .zgroup{position:absolute;display:flex;align-items:baseline;gap:2px;opacity:0;white-space:nowrap;font-weight:800;letter-spacing:-1px}.zzz .zgroup span:nth-child(1){font-size:2rem}.zzz .zgroup span:nth-child(2){font-size:1.1rem}.zzz .zgroup span:nth-child(3){font-size:.7rem}.stage:has(.sleeping) .zzz{opacity:1}.stage:has(.sleeping) .zzz .zgroup{animation:zzzFloat 4.5s ease-out infinite}.zzz .zgroup:nth-child(2){animation-delay:1.5s!important;left:12px;top:9px;animation-name:zzzFloatTwo!important}.zzz .zgroup:nth-child(3){animation-delay:3s!important;left:-9px;top:-5px;animation-name:zzzFloatThree!important}@keyframes zzzFloat{0%{opacity:0;transform:translate(0,10px) rotate(-10deg) scale(.7)}18%{opacity:.95}65%{opacity:.8}100%{opacity:0;transform:translate(28px,-95px) rotate(17deg) scale(1.18)}}@keyframes zzzFloatTwo{0%{opacity:0;transform:translate(0,10px) rotate(12deg) scale(.8)}18%{opacity:.9}70%{opacity:.7}100%{opacity:0;transform:translate(-23px,-79px) rotate(-20deg) scale(1.08)}}@keyframes zzzFloatThree{0%{opacity:0;transform:translate(0,12px) rotate(-15deg) scale(.65)}18%{opacity:.95}70%{opacity:.65}100%{opacity:0;transform:translate(14px,-113px) rotate(25deg) scale(1.3)}}.settings-toggle{position:absolute;top:12px;right:12px;width:44px;height:44px;border:1px solid #86749d;border-radius:14px;background:#49405f;color:white;font-size:1.55rem;cursor:pointer}.settings-panel{position:fixed;inset:0;background:#0b0c17cc;z-index:10;display:grid;place-items:center;padding:18px}.settings-panel[hidden]{display:none}.settings-card{background:#29263d;border:1px solid #86749d;border-radius:22px;width:min(100%,420px);max-height:85svh;overflow:auto;padding:22px;text-align:left;box-shadow:0 20px 65px #0009}.settings-card header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.settings-card h2{margin:0;font-size:1.3rem}.settings-card button{border:1px solid #86749d;background:#49405f;color:white;border-radius:10px;padding:8px 13px;font:inherit;cursor:pointer}.setting{display:block;margin:17px 0}.setting-title{display:flex;justify-content:space-between;gap:10px;font-size:.95rem}.setting input{width:100%;margin-top:9px;accent-color:#e9a1cc}.setting small{display:block;color:#c5bad2;margin-top:3px}.settings-note{font-size:.8rem;color:#c5bad2;margin-top:14px}</style>
</head>
<body><main style="position:relative"><button id="settingsToggle" class="settings-toggle" aria-label="Open settings" title="Settings">⚙</button><h1>Little Raven <small class="version">v0.4.1</small></h1><p>A tiny friend who loves attention.</p><section class="stage" aria-label="Your raven's perch"><div class="glow" aria-hidden="true"></div><svg class="perch" viewBox="0 0 300 330" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><ellipse cx="151" cy="305" rx="111" ry="12" fill="#121322" opacity=".5"/><path d="M27 289 Q75 282 131 289 Q193 282 273 289 L273 302 Q185 296 133 302 Q69 296 27 302Z" fill="#735344" stroke="#49352f" stroke-width="3"/><path d="M39 290 Q84 286 130 291 Q199 286 262 291" stroke="#b48767" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M80 303 L74 328 M226 303 L231 328" stroke="#594138" stroke-width="12" stroke-linecap="round"/><path d="M81 307 L76 328 M225 307 L230 328" stroke="#957058" stroke-width="3" stroke-linecap="round"/></svg><button class="raven" id="pet" aria-label="Pet the raven" title="Pet the raven">
<svg viewBox="0 0 300 330" role="img" aria-label="A cute round raven with purple feathers and bright eyes" xmlns="http://www.w3.org/2000/svg">
<path d="M103 244 90 291l34-10 23 10 15-39" fill="#24243c"/><path d="M174 252 192 291l-33-10-18 10-10-40" fill="#29273f"/>
<path d="M96 196 Q58 177 64 135 Q90 152 103 154" fill="#38354f"/>
<path d="M197 195 Q246 171 233 133 Q216 152 192 156" fill="#36314c"/>
<ellipse cx="150" cy="180" rx="94" ry="104" fill="#29273d"/><ellipse cx="150" cy="196" rx="73" ry="78" fill="#34314c"/>
<path class="wing" d="M87 166 Q40 192 70 242 Q89 260 111 232 Q89 214 87 166" fill="#201f35"/><path d="M83 216q12 18 29 16" stroke="#514965" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M108 90 100 61 128 77 147 44 161 77 191 59 189 101" fill="#29273d"/>
<ellipse cx="112" cy="150" rx="23" ry="27" fill="#f9f5ff"/><ellipse cx="187" cy="150" rx="23" ry="27" fill="#f9f5ff"/><g class="eye"><ellipse cx="118" cy="154" rx="12" ry="17" fill="#171827"/><ellipse cx="193" cy="154" rx="12" ry="17" fill="#171827"/><circle cx="122" cy="148" r="4.5" fill="white"/><circle cx="197" cy="148" r="4.5" fill="white"/></g><g class="sleep-eyes" fill="none" stroke="#a99ac5" stroke-width="5" stroke-linecap="round"><path d="M96 151 Q112 160 128 151"/><path d="M172 151 Q188 160 204 151"/></g>
<path d="M131 173 Q150 166 170 173 L151 197Z" fill="#e5ad65"/><path d="M131 173 Q150 185 170 173" fill="none" stroke="#bd824f" stroke-width="2"/><ellipse cx="94" cy="186" rx="15" ry="8" fill="#bd6d97" opacity=".3"/><ellipse cx="207" cy="186" rx="15" ry="8" fill="#bd6d97" opacity=".3"/>
<path d="M195 219 Q234 207 238 179 Q256 220 209 251" fill="#242239"/><path d="M205 245q18-5 27-17" stroke="#514965" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg></button><span class="zzz" aria-hidden="true"><span class="zgroup"><span>Z</span><span>z</span><span>z</span></span><span class="zgroup"><span>Z</span><span>z</span><span>z</span></span><span class="zgroup"><span>Z</span><span>z</span><span>z</span></span></span><div class="hearts" id="hearts" aria-hidden="true"></div></section><div class="needs" aria-label="Raven needs"><div class="need">Happiness<div class="meter"><div class="fill" id="happyBar"></div></div><span id="happyValue"></span></div><div class="need">Tummy<div class="meter"><div class="fill" id="hungerBar"></div></div><span id="hungerValue"></span></div><div class="need">Energy<div class="meter"><div class="fill" id="energyBar"></div></div><span id="energyValue"></span></div></div><div class="actions"><button id="feed">Feed</button><button id="play">Play</button><button id="sleep">Sleep</button></div><div class="hint">Tap or click the raven to pet it ♡</div><div class="status" id="status" aria-live="polite"></div></main><div class="settings-panel" id="settingsPanel" hidden><section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><header><h2 id="settingsTitle">⚙ Raven Settings</h2><button id="settingsClose" aria-label="Close settings">✕</button></header><div id="settingsControls"></div><div class="settings-note">Changes save automatically on this device.</div><button id="settingsReset">Restore defaults</button></section></div>
<script>
const pet=document.getElementById('pet'),hearts=document.getElementById('hearts'),status=document.getElementById('status');let timer;
pet.addEventListener('click',()=>{if(state.sleeping){status.textContent='Shh... your raven is sleeping!';return}adjust('happiness',8);pet.classList.remove('happy');void pet.offsetWidth;pet.classList.add('happy');clearTimeout(timer);timer=setTimeout(()=>pet.classList.remove('happy'),600);status.textContent='Your raven feels loved!';const a=pet.getBoundingClientRect(),b=hearts.getBoundingClientRect();for(let i=0;i<5;i++){const h=document.createElement('span');h.className='heart';h.textContent=i%2?'♥':'♡';h.style.color=i%2?'#ff91bd':'#ffd0e5';h.style.left=(a.left-b.left+a.width*(.25+Math.random()*.5))+'px';h.style.top=(a.top-b.top+a.height*(.2+Math.random()*.35))+'px';h.style.setProperty('--drift',(Math.random()*110-55)+'px');h.style.animationDelay=(i*.07)+'s';hearts.append(h);setTimeout(()=>h.remove(),1600)}});
const settingsKey='littleRavenSettings';
const settingsDefs=[
['sleepRegen','Sleep recovery',2,.5,10,.5,'% energy / min'],
['awakeDrain','Awake energy drain',.333,0,3,.1,'% energy / min'],
['tummyDrain','Tummy drain',.5,0,3,.1,'% / min'],
['happyDrain','Happiness drain',.1,0,2,.1,'% / min'],
['playCost','Play energy cost',15,0,30,1,'%'],
['feedGain','Food per feeding',25,5,60,5,'%'],
['feedEnergy','Energy per feeding',5,0,20,1,'%']];
let settings;try{settings=JSON.parse(localStorage.getItem(settingsKey))}catch{}if(!settings||typeof settings!=='object')settings={};
for(const [id,,def,min,max] of settingsDefs){const value=Number(settings[id]);settings[id]=Number.isFinite(value)?Math.min(max,Math.max(min,value)):def}
const controls=document.getElementById('settingsControls');
function saveSettings(){localStorage.setItem(settingsKey,JSON.stringify(settings))}
function buildSettings(){controls.replaceChildren();for(const [id,label,,min,max,step,unit] of settingsDefs){const row=document.createElement('label');row.className='setting';const heading=document.createElement('span');heading.className='setting-title';const name=document.createElement('span');name.textContent=label;const value=document.createElement('strong');value.textContent=settings[id]+' '+unit;heading.append(name,value);const slider=document.createElement('input');slider.type='range';slider.min=min;slider.max=max;slider.step=step;slider.value=settings[id];slider.addEventListener('input',()=>{settings[id]=Number(slider.value);value.textContent=settings[id]+' '+unit;saveSettings()});row.append(heading,slider);controls.append(row)}}
const panel=document.getElementById('settingsPanel'),toggle=document.getElementById('settingsToggle');
toggle.addEventListener('click',()=>{buildSettings();panel.hidden=false;document.getElementById('settingsClose').focus()});
function closeSettings(){panel.hidden=true;toggle.focus()}
document.getElementById('settingsClose').addEventListener('click',closeSettings);
panel.addEventListener('click',e=>{if(e.target===panel)closeSettings()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)closeSettings()});
document.getElementById('settingsReset').addEventListener('click',()=>{for(const [id,,def] of settingsDefs)settings[id]=def;saveSettings();buildSettings()});
saveSettings();
const key='littleRavenState';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||typeof state!=='object')state={happiness:70,hunger:25,energy:80};for(const k of ['happiness','hunger','energy'])state[k]=Math.max(0,Math.min(100,Number(state[k])||0));if(!state.tummyMigrated){state.hunger=100-state.hunger;state.tummyMigrated=true}state.sleeping=!!state.sleeping;
function render(){for(const [k,id] of [['happiness','happy'],['hunger','hunger'],['energy','energy']]){document.getElementById(id+'Bar').style.width=state[k]+'%';document.getElementById(id+'Value').textContent=Math.round(state[k])+'%'}pet.classList.toggle('sleeping',state.sleeping);document.getElementById('sleep').textContent=state.sleeping?'Wake':'Sleep';pet.setAttribute('aria-label',state.sleeping?'Sleeping raven':'Pet the raven');localStorage.setItem(key,JSON.stringify(state))}
function adjust(k,n){state[k]=Math.max(0,Math.min(100,state[k]+n));render()}
function tick(){const now=Date.now();const elapsed=Math.max(0,Math.min(now-(Number(state.lastTick)||now),7*86400000));const minutes=elapsed/60000;state.lastTick=now;if(state.sleeping){state.energy=Math.min(100,state.energy+minutes*settings.sleepRegen)}else{state.energy=Math.max(0,state.energy-minutes*settings.awakeDrain);state.hunger=Math.max(0,state.hunger-minutes*settings.tummyDrain);state.happiness=Math.max(0,state.happiness-minutes*settings.happyDrain)}render()}
tick();setInterval(tick,10000);
document.getElementById('feed').addEventListener('click',()=>{tick();if(state.sleeping){status.textContent='Wake your raven before feeding!';return}adjust('hunger',settings.feedGain);adjust('energy',settings.feedEnergy);status.textContent='Your raven enjoyed a snack!'});
document.getElementById('play').addEventListener('click',()=>{tick();if(state.sleeping){status.textContent='Your raven is sleeping. Wake it first!';return}if(state.energy<settings.playCost){status.textContent='Your raven is too sleepy to play!';return}adjust('energy',-settings.playCost);adjust('happiness',15);adjust('hunger',-10);pet.click();status.textContent='Your raven had fun playing!'});
document.getElementById('sleep').addEventListener('click',()=>{tick();state.sleeping=!state.sleeping;state.lastTick=Date.now();render();status.textContent=state.sleeping?'Your raven is tucked in and snoozing.':'Your raven woke up refreshed!'});
render();</script></body></html>
